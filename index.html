<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Navillera Charm Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============ FLOW 1: START ============ -->
<section id="flow-start" class="screen active" aria-label="Start screen">
  <div class="glow"></div>

  <img class="sparkle sparkle--pink sparkle--tl-1" src="assets/star-pink.png" alt="" aria-hidden="true" />
  <img class="sparkle sparkle--yellow sparkle--tl-2" src="assets/star-yellow.png" alt="" aria-hidden="true" />
  <img class="sparkle sparkle--yellow sparkle--tl-3" src="assets/star-yellow.png" alt="" aria-hidden="true" />

  <img class="sparkle sparkle--yellow sparkle--br-1" src="assets/star-pink.png" alt="" aria-hidden="true" />
  <img class="sparkle sparkle--pink sparkle--br-2" src="assets/star-yellow.png" alt="" aria-hidden="true" />
  <img class="sparkle sparkle--pink sparkle--br-3" src="assets/star-yellow.png" alt="" aria-hidden="true" />

  <div class="brand">
    <img class="brand__logo" src="assets/navillera-logo-cropped.png" alt="Navillera" />
    <h1 class="brand__tagline">Charm Photobooth</h1>
  </div>

  <button type="button" class="btn-start" data-nav="flow-select">
    <span class="button_top">Start</span>
  </button>
</section>

<!-- ============ FLOW 2: SELECT STRIP ============ -->
<section id="flow-select" class="screen" aria-label="Select strip screen">
  <div class="select-header">
    <button type="button" class="icon-btn icon-btn--back" data-nav="flow-start" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 class="select-title">Select Strip</h2>
    <span class="icon-btn icon-btn--spacer" aria-hidden="true"></span>
  </div>

  <div class="strip-options" role="radiogroup" aria-label="Strip layout">

    <button type="button" class="strip-card" data-strip="1" role="radio" aria-checked="false">
      <div class="strip-card__preview strip-card__preview--1">
        <span class="slot"></span>
      </div>
      <span class="strip-card__label">Single Shot</span>
      <span class="strip-card__meta">1 photo</span>
    </button>

    <button type="button" class="strip-card" data-strip="2" role="radio" aria-checked="false">
      <div class="strip-card__preview strip-card__preview--2">
        <span class="slot"></span>
        <span class="slot"></span>
      </div>
      <span class="strip-card__label">Duo Strip</span>
      <span class="strip-card__meta">2 photos</span>
    </button>

    <button type="button" class="strip-card" data-strip="3" role="radio" aria-checked="false">
      <div class="strip-card__preview strip-card__preview--3">
        <span class="slot"></span>
        <span class="slot"></span>
        <span class="slot"></span>
      </div>
      <span class="strip-card__label">Classic Strip</span>
      <span class="strip-card__meta">3 photos</span>
    </button>

  </div>

  <button type="button" class="btn-continue" id="btn-to-capture" disabled data-nav="flow-capture">Continue</button>
</section>

<!-- ============ FLOW 3: CAPTURE ============ -->
<section id="flow-capture" class="screen" aria-label="Photo capture screen">
  <div class="capture-frame">
    <video id="camera-preview" autoplay playsinline muted></video>
    <canvas id="capture-canvas" hidden></canvas>
    <div class="countdown" id="countdown" aria-live="assertive"></div>
    <div class="shot-flash" id="shot-flash"></div>
  </div>

  <div class="capture-slots" id="capture-slots">
    <span class="capture-slot" data-slot="0"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><path d="M3 16l5-4 3 3 4-5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="capture-slot" data-slot="1"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><path d="M3 16l5-4 3 3 4-5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="capture-slot" data-slot="2"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><path d="M3 16l5-4 3 3 4-5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="capture-slot" data-slot="3"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><path d="M3 16l5-4 3 3 4-5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="capture-slot" data-slot="4"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10.5" r="1.5" fill="currentColor"/><path d="M3 16l5-4 3 3 4-5 6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </div>

  <p class="capture-status" id="capture-status">Get ready…</p>
</section>

<!-- ============ FLOW 4: SELECT & CONFIRM ============ -->
<section id="flow-picker" class="screen" aria-label="Choose your photos screen">
  <div class="select-header">
    <span class="icon-btn icon-btn--spacer" aria-hidden="true"></span>
    <h2 class="select-title" id="picker-title">Pick Your Favorites</h2>
    <span class="icon-btn icon-btn--spacer" aria-hidden="true"></span>
  </div>
  <div class="picker-body">
    <p class="picker-sub" id="picker-sub">Choose 1 photo for your strip</p>

    <div class="picker-grid" id="picker-grid" role="group" aria-label="Captured photos"></div>

    <button type="button" class="btn-continue" id="btn-to-print" disabled data-nav="flow-print">Confirm &amp; Continue</button>
  </div>
</section>

<!-- ============ FLOW 5: PRINT ============ -->
<section id="flow-print" class="screen" aria-label="Print your strip screen">
  <div class="print-body">
    <h2 class="select-title">Your Strip Is Ready</h2>

    <div class="print-area" id="print-area">
      <div class="flip-card" id="flip-card" role="button" tabindex="0" aria-pressed="false" aria-label="Tap to flip the strip and reveal your photos">
        <div class="flip-card-inner">
          <div class="flip-card-front strip-cover">
            <div class="strip-cover__glow"></div>
            <img class="strip-cover__logo" src="assets/navillera-mark.png" alt="" aria-hidden="true" />
            <span class="strip-cover__hint">Tap to reveal</span>
          </div>
          <div class="flip-card-back strip-output" id="strip-output"></div>
        </div>
      </div>
    </div>

    <div class="print-actions">
      <button type="button" class="btn-secondary" data-nav="flow-start" id="btn-start-over">Done</button>
      <button type="button" class="btn-print" id="btn-print">Print</button>
    </div>
  </div>
</section>

<script src="js/app.js"></script>
</body>
</html>
